// Public source build: external MotiveWave SDK, no installation/deployment tasks.
plugins { id 'java' }
def libDir = file('lib')
def sdkPath = providers.environmentVariable('MWAVE_SDK_JAR').orNull
if (!sdkPath || !file(sdkPath).isFile()) {
    throw new GradleException('Set MWAVE_SDK_JAR to an external SDK JAR obtained from MotiveWave under your own authorization.')
}
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
sourceSets {
    main {
        java { srcDirs = ['src']; include '**/*.java' }
        resources { srcDirs = ['src']; include '**/*.properties'; exclude '**/db.properties' }
    }
}
repositories { flatDir { dirs libDir } }
dependencies {
    implementation files(sdkPath)
    implementation files("${libDir}/postgresql-42.7.3.jar")
    implementation files("${libDir}/HikariCP-5.1.0.jar")
    implementation files("${libDir}/slf4j-api-2.0.13.jar")
    implementation files("${libDir}/slf4j-simple-2.0.13.jar")
}
subprojects {
    repositories { mavenCentral(); flatDir { dirs rootProject.file('lib') } }
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('java')) {
            dependencies {
                implementation files("${rootProject.projectDir}/lib/postgresql-42.7.3.jar")
                implementation files("${rootProject.projectDir}/lib/HikariCP-5.1.0.jar")
                implementation files("${rootProject.projectDir}/lib/slf4j-api-2.0.13.jar")
                implementation files("${rootProject.projectDir}/lib/slf4j-simple-2.0.13.jar")
            }
        }
    }
}
allprojects {
    tasks.withType(ProcessResources).configureEach { exclude '**/db.properties' }
    tasks.withType(Jar).configureEach { exclude '**/db.properties' }
}
